[package]
name = "swerve"
version = "0.2.0"
edition = "2024"
description = "Fast, macOS-native DPI bypass proxy with zero-error auto-learn, persistent DoH, and live web UI"
license = "MIT"

[[bin]]
name = "swerve"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "signal", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
